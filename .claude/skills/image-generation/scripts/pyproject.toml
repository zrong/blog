[project]
name = "imggen"
version = "0.1.0"
description = "AI 图片生成工具：支持 OpenAI/Gemini 兼容 API"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
imggen = "imggen.cli:app"
